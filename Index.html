<!DOCTYPE html>
<html lang="zh-Hant-TW">
<!--
  體育表演會 成績回報系統（介面）
  設計者：臺北市福林國小 許士彥 2026.11.21.
-->
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>體表會成績回報系統</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#16211c;--mute:#5b6a63;--line:#d5dcd7;--pri:#0b5d4b;--pri-ink:#fff;--pri-soft:#e2f1ec;--red:#b3261e;--red-soft:#fde8e6;--amber:#8a5a00;--amber-soft:#fff1d1;--blue:#1d4f91;--blue-soft:#e3edfa;--ok:#1b6b3a;--ok-soft:#e1f3e7}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--pri);color:var(--pri-ink);padding:12px 16px 0;position:sticky;top:0;z-index:5}
header .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;margin:0;font-weight:700}
#ver{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:600;vertical-align:middle;white-space:nowrap}
header small{display:block;font-size:12px;opacity:.85;font-weight:400}
#whoBtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:#fff;opacity:.75;font-size:15px;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{opacity:1;font-weight:700;border-bottom-color:#fff}
main{max-width:720px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label.f{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
label.f:first-child{margin-top:0}
.req::after{content:" *";color:var(--red)}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid #9aa8a1;border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #7fc4b0;outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border:1.5px solid #9aa8a1;background:#fff;border-radius:10px;font:inherit;font-weight:600;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:1.5px solid var(--line);border-radius:12px;margin:14px 0 0;padding:10px 12px 14px;min-width:0}
legend{font-weight:700;padding:0 6px;font-size:16px}
legend span{font-weight:400;color:var(--mute);font-size:13px}
.score{display:flex;align-items:center;gap:6px}
.score input{width:84px;text-align:center;font-size:18px}
.score b{font-weight:600}
.check{display:flex;align-items:center;gap:10px;min-height:48px;margin-top:14px;font-weight:600}
.check input{width:24px;height:24px;accent-color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);font:inherit;font-weight:600;text-decoration:none}
.btn.pri{background:var(--pri);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:56px;font-size:18px;margin-top:18px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.photo img{display:block;max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px}
.err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;margin-right:4px;white-space:nowrap}
.s-待處理{background:var(--amber-soft);color:var(--amber)}
.s-處理中{background:var(--blue-soft);color:var(--blue)}
.s-已完成{background:var(--ok-soft);color:var(--ok)}
.c-urgent,.c-over{background:var(--red-soft);color:var(--red)}
.c-audit{background:var(--pri-soft);color:var(--pri)}
.c-fix{background:#efe6fb;color:#5a2d91}
.certlab{margin:12px 0 6px;font-weight:600;font-size:15px}
.mvbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.steps span{font-size:12.5px;padding:2px 8px;border-radius:6px;background:#eef1ef;color:#7a8780;white-space:nowrap}
.steps span.on{background:var(--ok-soft);color:var(--ok);font-weight:700}
.steps span.now{background:var(--amber-soft);color:var(--amber);font-weight:700}
.evpick{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:8px}
.evpick label{display:flex;align-items:center;gap:8px;min-height:40px;font-size:15px}
.evpick input{width:20px;height:20px}
.note{background:var(--amber-soft);color:#5a3b00;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.note .btn.sm{background:#fff}
.case{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.case.urgent{border-left:6px solid var(--red)}
.case h3{margin:6px 0 4px;font-size:17px}
.case .meta{color:var(--mute);font-size:13px}
.places{margin:6px 0 0;padding:0;list-style:none}
.places li{padding:2px 0}
.places b{display:inline-block;min-width:4.2em}
.filters{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.filters button{flex:0 0 auto;min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid #9aa8a1;background:#fff;font:inherit;font-size:14px;color:var(--ink)}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.done{text-align:center}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;line-height:64px;margin:6px auto 8px}
.done .num{font-size:44px;font-weight:800;letter-spacing:2px;color:var(--pri);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:26px}
.stats .bad b{color:var(--red)}
h2.sec{font-size:15px;color:var(--mute);margin:18px 2px 8px}
.mc h3{font-size:22px}
.mc .places li{font-size:20px;padding:6px 0;border-top:1px dashed var(--line)}
.mc .places .sc{font-weight:700}
.mc.said{opacity:.6}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
#sheet .x{float:right;border:0;background:#eef1ef;border-radius:50%;width:40px;height:40px;font-size:20px}
.log{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.log li{border-left:3px solid var(--line);padding:2px 0 8px 10px}
.log time{color:var(--mute);font-size:12.5px;display:block}
dl{margin:8px 0;display:grid;grid-template-columns:5.5em 1fr;gap:4px 8px;font-size:15px}
dt{color:var(--mute)}dd{margin:0}
details summary{cursor:pointer;min-height:32px;font-size:16px}
.rrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;padding:8px 0;border-top:1px dashed var(--line)}
.rrow>span:first-child{flex:1 1 11em}
.rrow>span:last-child{white-space:nowrap}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16211c;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}
#toast[hidden]{display:none}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.bar span{font-size:13px;color:var(--mute)}
@media (min-width:600px){#modal{align-items:center}#sheet{border-radius:16px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><span id="appName">體表會成績回報系統</span><span id="ver"></span><small id="sub"></small></h1>
    <button id="whoBtn" type="button">身分登入</button>
  </div>
  <nav id="nav" role="tablist">
    <button data-tab="report" role="tab">成績填報</button>
    <button data-tab="mine" role="tab">我的回報</button>
    <button data-tab="progress" role="tab">進度查詢</button>
    <button data-tab="admin" role="tab">列印作業</button>
    <button data-tab="mc" role="tab">司儀播報</button>
    <button data-tab="audit" role="tab">頒發獎狀</button>
    <button data-tab="roster" role="tab">名冊管理</button>
    <button data-tab="settings" role="tab">系統設定</button>
  </nav>
</header>
<main id="main"><div class="empty">載入中…</div></main>
<div id="modal" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden role="status"></div>

<script>
'use strict';
var APP_VERSION = 'v1.20.2'; // 介面版本，改版時與 Code.gs 的 VERSION 一起更新
document.getElementById('ver').textContent = APP_VERSION;
var S = { boot: null, cases: [], who: { roles: [], name: '', email: '' }, tab: 'report', type: '個人', certScope: 'unprinted', certEvents: {},
  photo: '', done: null, q: '', filter: '全部', loadedAt: '', busy: false };
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var store = {
  get: function (k) { try { return localStorage.getItem('fl_' + k) || ''; } catch (e) { return ''; } },
  set: function (k, v) { try { localStorage.setItem('fl_' + k, v); } catch (e) { /* 無法儲存時略過 */ } }
};
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, no) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { no(new Error((e && e.message) || String(e))); });
    r[fn].apply(r, args);
  });
}
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600); }
var NUM = { '1': '一', '2': '二', '3': '三' };
function clsLabel(c) { var g = { '1': '一', '2': '二', '3': '三', '4': '四', '5': '五', '6': '六' }[String(c).charAt(0)] || ''; return g + '年' + Number(String(c).slice(1)) + '班'; }
function has(role) { return S.who.roles.indexOf(role) >= 0; }
function twNow() {
  var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return { date: p.year + '-' + p.month + '-' + p.day, time: (p.hour === '24' ? '00' : p.hour) + ':' + p.minute };
}

/* ───────── 啟動與資料更新 ───────── */
function start() {
  call('getBootstrap', store.get('pin')).then(function (b) {
    S.boot = b; S.who = b.who; applyHeader(); renderWho(); show(S.tab);
    refresh(true);
  }).catch(function (e) { $('#main').innerHTML = '<div class="err">載入失敗：' + esc(e.message) + '</div>'; });
}
function refresh(silent) {
  return call('listCases', store.get('pin')).then(function (r) {
    S.cases = r.cases; S.who = r.who; S.loadedAt = r.now; S.mcOrder = r.mcOrder || []; if (S.boot) { S.boot.allowRevise = r.allowRevise !== false; } renderWho();
    if (S.tab !== 'report' && S.tab !== 'roster' && S.tab !== 'settings' && $('#modal').hidden) { show(S.tab); }
  }).catch(function (e) { if (!silent) { toast('更新失敗：' + e.message); } });
}
setInterval(function () { if (!document.hidden && S.boot && S.tab !== 'roster' && S.tab !== 'settings' && $('#modal').hidden) { refresh(true); } }, 20000);
function renderWho() { $('#whoBtn').textContent = S.who.roles.length ? S.who.roles.join('、') + '｜登出' : '身分登入'; }
$('#whoBtn').addEventListener('click', function () {
  if (S.who.roles.length && store.get('pin')) { store.set('pin', ''); refresh().then(function () { toast('已登出'); show(S.tab); }); }
  else { pinDialog(); }
});
$('#nav').addEventListener('click', function (e) { var b = e.target.closest('button[data-tab]'); if (b) { S.q = ''; S.filter = '全部'; show(b.dataset.tab); } });
function show(tab) {
  S.tab = tab;
  $$('#nav button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
  var keep = document.activeElement && document.activeElement.id === 'q';
  ({ report: viewReport, mine: viewMine, progress: viewProgress, mc: viewMc, admin: viewAdmin, audit: viewAudit, roster: viewRoster, settings: viewSettings })[tab]();
  if (keep && $('#q')) { var q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ───────── 身分登入 ───────── */
function pinDialog(after) {
  openSheet('<h2>身分登入</h2><p class="hint">獎狀列印、司儀、校長請輸入各自的通行碼。檢錄員填報不需要登入。</p>' +
    '<label class="f" for="pin">通行碼</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">' +
    '<div id="pinErr"></div><button class="btn pri block big" id="pinGo" type="button">登入</button>');
  $('#pin').focus();
  $('#pinGo').addEventListener('click', function () {
    var p = $('#pin').value.trim(); if (!p) { return; }
    this.disabled = true; var btn = this;
    call('listCases', p).then(function (r) {
      if (!r.who.roles.length) { $('#pinErr').innerHTML = '<div class="err">通行碼不正確</div>'; btn.disabled = false; return; }
      store.set('pin', p); S.cases = r.cases; S.who = r.who; renderWho(); closeSheet(); toast('已登入：' + r.who.roles.join('、')); show(S.tab);
      if (after) { after(); }
    }).catch(function (e) { $('#pinErr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; btn.disabled = false; });
  });
}
function gate(role, label) {
  if (has(role)) { return false; }
  $('#main').innerHTML = '<div class="card"><h2 style="margin-top:0">' + esc(label) + '</h2><p>此頁面限「' + esc(role) + '」身分使用。</p>' +
    '<button class="btn pri block" id="gateBtn" type="button">輸入通行碼</button></div>';
  $('#gateBtn').addEventListener('click', function () { pinDialog(); });
  return true;
}

/* ───────── 成績填報 ───────── */
function viewReport() {
  if (S.done) { return viewDone(); }
  var now = twNow();
  $('#main').innerHTML = '<form id="f" class="card" novalidate>' +
    '<label class="f">比賽類別</label><div class="seg" id="seg">' +
    '<button type="button" data-type="個人">個人單項競賽</button><button type="button" data-type="接力">大隊接力</button></div>' +
    '<label class="f req" for="recorder">檢錄員姓名</label><input id="recorder" type="text" maxlength="20" autocomplete="name" value="' + esc(store.get('name')) + '">' +
    '<label class="f req" for="event">項目</label><select id="event"></select><div id="dupBox" data-state=""></div>' +
    '<div class="row2"><div><label class="f req" for="date">日期</label><input id="date" type="date" value="' + now.date + '"></div>' +
    '<div><label class="f req" for="time">時間</label><input id="time" type="time" value="' + now.time + '"></div></div>' +
    '<div id="places"></div>' +
    '<label class="check"><input id="urgent" type="checkbox">急件（請優先處理）</label>' +
    '<label class="f">現場照片（選填）</label><div class="photo" id="photo"></div>' +
    '<input id="cam" type="file" accept="image/*" capture="environment" hidden><input id="pick" type="file" accept="image/*" hidden>' +
    '<div id="formErr"></div><button class="btn pri block big" id="send" type="submit">送出成績</button></form>';
  $('#seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { S.type = b.dataset.type; fillEvents(); } });
  $('#event').addEventListener('change', onEventChange);
  bindOther($('#places'));
  $('#cam').addEventListener('change', onPhoto); $('#pick').addEventListener('change', onPhoto);
  $('#f').addEventListener('submit', function (e) { e.preventDefault(); submit(false); });
  fillEvents(); renderPhoto();
}
function evList() { return S.type === '接力' ? S.boot.relay : S.boot.individual; }
function fillEvents() {
  $$('#seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.type === S.type)); });
  var groups = {}; var order = [];
  evList().forEach(function (e) { if (!groups[e.grade]) { groups[e.grade] = []; order.push(e.grade); } groups[e.grade].push(e); });
  $('#event').innerHTML = '<option value="">請選擇項目</option>' + order.map(function (g) {
    return '<optgroup label="' + g + '年級">' + groups[g].map(function (e) { return '<option>' + esc(e.name) + '</option>'; }).join('') + '</optgroup>';
  }).join('');
  onEventChange();
}
function curEvent() { var n = $('#event').value; return evList().filter(function (e) { return e.name === n; })[0]; }
function placeFieldsHtml(e, type) {
  var html = '';
  [1, 2, 3].forEach(function (rank) {
    var opt = rank === 1 ? '' : ' <span>（沒有可留空）</span>';
    html += '<fieldset data-rank="' + rank + '"><legend>第 ' + rank + ' 名' + opt + '</legend>';
    if (type === '個人') {
      html += '<label class="f">選手</label><select data-k="sel"><option value="">請選擇選手</option>' +
        e.finalists.map(function (p, i) { return '<option value="' + i + '">' + esc(clsLabel(p.cls) + '　' + p.name) + '</option>'; }).join('') +
        '<option value="other">其他（手動輸入）</option></select>' +
        '<div class="other row2" hidden><div><label class="f">班級代碼</label><input type="text" inputmode="numeric" maxlength="3" data-k="cls" placeholder="例如 503"></div>' +
        '<div><label class="f">姓名</label><input type="text" maxlength="12" data-k="name"></div></div>' +
        '<label class="f">成績</label><div class="score"><input type="text" inputmode="numeric" maxlength="3" data-k="s" aria-label="秒"><b>秒</b>' +
        '<input type="text" inputmode="numeric" maxlength="2" data-k="cs" aria-label="百分秒" placeholder="00"><b>（百分秒）</b></div>';
    } else {
      html += '<label class="f">班級</label><select data-k="cls"><option value="">請選擇班級</option>' +
        e.classes.map(function (c) { return '<option value="' + c + '">' + esc(clsLabel(c)) + '</option>'; }).join('') + '</select>' +
        '<label class="f">成績' + (e.grade === '三' ? '（趣味賽不記成績，可留空）' : '') + '</label><div class="score"><input type="text" inputmode="numeric" maxlength="2" data-k="m" aria-label="分"><b>分</b>' +
        '<input type="text" inputmode="numeric" maxlength="2" data-k="s" aria-label="秒"><b>秒</b>' +
        '<input type="text" inputmode="numeric" maxlength="2" data-k="cs" aria-label="百分秒" placeholder="00"></div>';
    }
    html += '</fieldset>';
  });
  return html;
}
function bindOther(root) {
  root.addEventListener('change', function (e) {
    if (e.target.dataset.k === 'sel') { e.target.closest('fieldset').querySelector('.other').hidden = e.target.value !== 'other'; }
  });
  // 成績欄位打滿兩位數就自動跳到下一格：分 → 秒 → 百分秒。刪除時不跳
  root.addEventListener('input', function (e) {
    var k = e.target.dataset.k; if (k !== 's' && k !== 'm') { return; }
    if (e.inputType && e.inputType.indexOf('delete') === 0) { return; }
    if (!/^\d{2}$/.test(e.target.value)) { return; }
    var next = e.target.closest('fieldset').querySelector('[data-k="' + (k === 'm' ? 's' : 'cs') + '"]');
    if (next) { next.focus(); if (next.select) { next.select(); } }
  });
}
function fillPlaces() {
  var e = curEvent();
  if (!e) {
    $('#places').innerHTML = evList().length ? '<p class="hint">選擇項目後，在這裡填寫前三名。</p>'

/* ───────── 名冊管理 ───────── */
var R = { rows: null, edit: -1, preview: null, mode: 'append', text: '' };
var GRADES = { '一': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6' };
function half(s) { return String(s == null ? '' : s).replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 65248); }).replace(/　/g, ' ').trim(); }
function checkRow(r) { // 回傳錯誤訊息，沒有問題回傳空字串
  if (r[0] !== '個人' && r[0] !== '接力') { return '類別只能填「個人」或「接力」'; }
  if (!r[1]) { return '缺少項目'; }
  if (r[1].length > 30) { return '項目名稱過長'; }
  if (!GRADES[r[1].charAt(0)]) { return '項目名稱要以年級開頭，例如「五年級100公尺男生組」'; }
  if (!/^[1-6]\d{2}$/.test(r[2])) { return '班級要填三碼代碼，例如 503'; }
  if (r[2].charAt(0) !== GRADES[r[1].charAt(0)]) { return '班級 ' + r[2] + ' 與項目年級不符'; }
  if (r[3] && !/^\d{1,2}$/.test(r[3])) { return '座號要填數字'; }
  if (r[4].length > 12) { return '姓名過長'; }
  return '';
}
function parseRoster(text) {
  var rows = [], errors = [];
  String(text).split(/\r?\n/).forEach(function (line, i) {
    if (!line.trim()) { return; }
    var cells = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/[,，]/)).map(half);
    if (cells[0] === '類別') { return; } // 標題列
    while (cells.length < 5) { cells.push(''); }
    var r = cells.slice(0, 5); r[2] = r[2].replace(/\.0$/, ''); r[3] = r[3].replace(/\.0$/, '');
    var e = checkRow(r);
    if (e) { errors.push('第 ' + (i + 1) + ' 列：' + e); } else { rows.push(r); }
  });
  return { rows: rows, errors: errors };
}
function rosterStats(rows) {
  var ev = {}, order = [];
  rows.forEach(function (r) { var k = r[0] + '|' + r[1]; if (!ev[k]) { ev[k] = { type: r[0], name: r[1], n: 0, cls: {} }; order.push(k); } ev[k].n += r[4] ? 1 : 0; ev[k].cls[r[2]] = 1; });
  return order.map(function (k) { return ev[k]; });
}
function statsHtml(rows) {
  var st = rosterStats(rows);
  if (!st.length) { return '<p class="hint">沒有資料</p>'; }
  return '<ul class="places">' + st.map(function (e) {
    return '<li>' + esc(e.name) + '　<span class="meta">' + (e.type === '接力' ? Object.keys(e.cls).length + ' 班，' : '') + e.n + ' 人</span></li>';
  }).join('') + '</ul>';
}

    return { id: g('案件編號'), at: g('送出時間'), type: g('類別'), event: g('項目'), date: g('比賽日期'), time: g('比賽時間'), recorder: g('檢錄員'), urgent: g('急件'),
      places: places, status: g('狀態'), assignee: g('負責人'), result: g('處理結果'), doneAt: g('完成時間'), announcedAt: g('播報時間'), printedAt: g('列印時間'),
      audit: g('稽核'), auditNote: g('稽核意見'), auditAt: g('稽核時間'), log: log };
  });
}
function importCasesFile(file) {
  var rd = new FileReader();
  rd.onerror = function () { toast('無法讀取檔案'); };
  rd.onload = function () {
    var items;
    try { items = csvToItems(parseCsv(decodeCsv(rd.result))); if (!items.length) { throw new Error('檔案只有標題列，沒有資料'); } }
    catch (e) { openSheet('<h2>無法匯入</h2><div class="err">' + esc(e.message) + '</div>'); return; }
    openSheet('<h2>匯入案件資料</h2><p>檢查中…</p>');
    call('importCases', store.get('pin'), items, true).then(function (r) {
      if (!r.ok) {
        openSheet('<h2>無法匯入</h2><div class="err">有 ' + r.errorCount + ' 列資料不正確，整批都不會匯入，請修正後再試：<br>' + r.errors.map(esc).join('<br>') +
          (r.errorCount > r.errors.length ? '<br>…其餘 ' + (r.errorCount - r.errors.length) + ' 列' : '') + '</div><p class="hint">列號以檔案為準，第 1 列是標題。</p>');
        return;
      }
      openSheet('<h2>匯入案件資料</h2><p>檔案「' + esc(file.name) + '」共 ' + r.count + ' 筆，格式正確。</p><ul class="places">' +
        items.slice(0, 12).map(function (it) { return '<li>' + esc(it.id || '（自動編號）') + '　' + esc(it.event) + '　<span class="meta">' + it.places.length + ' 個名次</span></li>'; }).join('') +
        (items.length > 12 ? '<li class="meta">…其餘 ' + (items.length - 12) + ' 筆</li>' : '') + '</ul>' +
        '<p class="hint">匯入的案件會加在目前的 ' + S.cases.length + ' 筆之後。案件編號留空的會自動編號。現場照片無法由檔案還原。</p>' +
        '<div id="impErr"></div><button class="btn pri block big" id="impGo" type="button">確認匯入 ' + r.count + ' 筆</button>');
      $('#impGo').addEventListener('click', function () {
        var b = this; b.disabled = true; b.textContent = '匯入中…';
        call('importCases', store.get('pin'), items, false).then(function (x) {
          if (!x.ok) { b.disabled = false; b.textContent = '確認匯入'; $('#impErr').innerHTML = '<div class="err">' + x.errors.map(esc).join('<br>') + '</div>'; return; }
          closeSheet(); toast('已匯入 ' + x.count + ' 筆案件'); return refresh();
        }).catch(function (e) { b.disabled = false; b.textContent = '確認匯入'; $('#impErr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
      });
    }).catch(function (e) { openSheet('<h2>無法匯入</h2><div class="err">' + esc(e.message) + '</div>'); });
  };
  rd.readAsArrayBuffer(file);
}
function casesCsv(list) {
  var head = csvHead();
  var rows = list.map(function (c) {
    var r = [c.id, c.at, c.type === '接力' ? '大隊接力' : '個人單項', c.event, c.date, c.time, c.recorder, c.urgent ? '是' : '否'];
    [1, 2, 3].forEach(function (n) { var x = c.places.filter(function (p) { return Number(p.rank) === n; })[0]; r.push(x ? x.cls : '', x ? (x.name || '') : '', x ? x.score : ''); });
    return r.concat([c.status, c.assignee, c.result, c.doneAt, c.announcedAt, c.printedAt, c.audit, c.auditNote, c.auditAt, c.hasPhoto ? '是' : '否',
      c.log.map(function (l) { return l.t + ' ' + l.by + '：' + l.what; }).join('\n')]);
  });
  return '\uFEFF' + [head].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n';
}
function downloadCases(list, name) { saveBlob(new Blob([casesCsv(list)], { type: 'text/csv;charset=utf-8' }), name + '.csv'); }
function confirmTwice(t1, m1, t2, m2, okText, onOk) { // 刪除類動作一律確認兩次
  confirmSheet(t1, m1, '繼續', function () { confirmSheet(t2, m2, okText, onOk); });
}
/* ───────── 案件詳情 ───────── */
function openSheet(html) { $('#sheet').innerHTML = '<button class="x" type="button" aria-label="關閉">×</button>' + html; $('#modal').hidden = false; $('#sheet .x').addEventListener('click', closeSheet); $('#sheet').scrollTop = 0; }
function closeSheet() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
$('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') { closeSheet(); } });
function confirmSheet(title, msg, okText, onOk) {
  openSheet('<h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p><div class="btns"><button class="btn" id="cNo" type="button">返回修改</button><button class="btn pri" id="cOk" type="button">' + esc(okText) + '</button></div>');
  $('#cNo').addEventListener('click', closeSheet);
  $('#cOk').addEventListener('click', function () { closeSheet(); onOk(); });
}
function detail(id, mode) {
  var c = S.cases.filter(function (x) { return x.id === id; })[0]; if (!c) { return; }
  var html = '<h2 style="margin:0 0 6px">' + esc(c.id) + '　' + esc(c.event) + '</h2><div>' + chips(c) + '</div>' + stepper(c) + placesHtml(c.places) +
    '<dl><dt>類別</dt><dd>' + (c.type === '接力' ? '大隊接力' : '個人單項競賽') + '</dd><dt>比賽時間</dt><dd>' + esc(c.date + ' ' + c.time) + '</dd>' +
    '<dt>檢錄員</dt><dd>' + esc(c.recorder) + '</dd><dt>送出時間</dt><dd>' + esc(c.at) + '</dd>' +
    '<dt>負責人</dt><dd>' + esc(c.assignee || '尚未分派') + '</dd><dt>處理結果</dt><dd>' + esc(c.result || '尚未填寫') + '</dd>' +
    (c.doneAt ? '<dt>完成時間</dt><dd>' + esc(c.doneAt) + '</dd>' : '') +
    '</dl>';
  if (c.hasPhoto) { html += '<div id="ph"><button class="btn block" id="phBtn" type="button">查看現場照片</button></div>'; }
  if (mode === 'admin' && has('行政')) {
    html += '<h3>處理案件</h3><label class="f" for="aWho">負責人</label><input id="aWho" type="text" maxlength="20" list="aList" value="' + esc(c.assignee) + '">' +
      '<datalist id="aList">' + S.boot.assignees.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
      '<label class="f" for="aSt">狀態</label><select id="aSt">' + ['待處理', '處理中', '已完成'].map(function (s) { return '<option' + (s === c.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
      '<label class="f" for="aRes">實際處理結果（標記已完成時必填）</label><textarea id="aRes" maxlength="300" placeholder="例如：獎狀 3 張已列印，交司儀台">' + esc(c.result) + '</textarea>' +
      '<div id="aErr"></div><button class="btn pri block big" id="aSave" type="button">儲存</button>' +
      '<button class="btn block" id="aFix" type="button" style="margin-top:10px">更正成績（班級、姓名、成績）</button>' +
      '<h3>刪除這筆案件</h3><div class="btns"><button class="btn" id="dlOne" type="button">下載這筆資料</button>' +
      '<button class="btn danger" id="delOne" type="button"' + (DL.one[c.id] === casesSig([c]) ? '' : ' disabled') + '>刪除這筆案件</button></div>' +
      '<p class="hint">先下載這筆資料，刪除按鈕才會開放。刪除前會確認兩次，並自動抄一份到「案件備份」工作表。</p>' +
      '<h3>下載 Word 獎狀</h3><div id="certBox">' + certButtons(c) + '</div>' +
      '<button class="btn block" id="prnTog" type="button" style="margin-top:10px">' + (c.printedAt ? '取消已列印（列印於 ' + esc(c.printedAt.slice(11, 16)) + '）' : '手動標記為已列印') + '</button><p class="hint">「下載 Word」用 Word 開啟列印。「列印／PDF」會開新分頁並跳出列印視窗，可直接印或另存為 PDF，不需要 Word。成績更正後請重新產生。</p>';
  }
  html += '<h3>處理紀錄</h3><ul class="log">' + c.log.map(function (l) { return '<li><time>' + esc(l.t) + '　' + esc(l.by) + '</time>' + esc(l.what) + '</li>'; }).join('') + '</ul>';
  openSheet(html);
  var pb = $('#phBtn');
  if (pb) {
    pb.addEventListener('click', function () {
      pb.disabled = true; pb.textContent = '照片載入中…';
      call('getPhoto', c.id).then(function (u) { $('#ph').innerHTML = u ? '<div class="photo"><img alt="現場照片" src="' + u + '"></div>' : '<p class="hint">找不到照片</p>'; })
        .catch(function (e) { pb.disabled = false; pb.textContent = '查看現場照片'; toast(e.message); });
    });
  }
  if ($('#aFix')) { $('#aFix').addEventListener('click', function () { fixSheet(c); }); }
  if ($('#certBox')) { bindCertButtons($('#certBox'), c.id, c.id + '_' + c.event); }
  if ($('#prnTog')) {
    $('#prnTog').addEventListener('click', function () {
      var b = this; b.disabled = true;
      call('markPrinted', store.get('pin'), [c.id], !c.printedAt).then(function () { closeSheet(); toast(c.id + (c.printedAt ? ' 已取消已列印' : ' 已標記為已列印')); return refresh(); })
        .catch(function (e) { b.disabled = false; toast(e.message); });
    });
  }
  if ($('#dlOne')) {
    $('#dlOne').addEventListener('click', function () { downloadCases([c], '體表會案件資料_' + c.id + '_' + c.event); DL.one[c.id] = casesSig([c]); $('#delOne').disabled = false; toast('已下載 ' + c.id); });
    $('#delOne').addEventListener('click', function () {
      confirmTwice('刪除 ' + c.id + '？', c.event + ' 的成績與處理紀錄都會從系統移除。', '最後確認：真的要刪除 ' + c.id + ' 嗎？',
        '刪除後網站上無法復原，這個案件編號也不會再使用。資料會保留在試算表的「案件備份」工作表。', '刪除案件', function () {
          call('deleteCase', store.get('pin'), c.id).then(function () { delete DL.one[c.id]; toast(c.id + ' 已刪除'); return refresh(); })
            .catch(function (e) { toast(e.message); refresh(); });
        });
    });
  }
  var sv = $('#aSave');
  if (sv) {
    sv.addEventListener('click', function () {
      var patch = { assignee: $('#aWho').value.trim(), status: $('#aSt').value, result: $('#aRes').value.trim() };
      if (patch.status === '已完成' && !patch.result) { $('#aErr').innerHTML = '<div class="err">標記已完成前，請填寫實際處理結果</div>'; return; }
      sv.disabled = true; sv.textContent = '儲存中…';
      call('adminUpdate', store.get('pin'), c.id, patch).then(function () { closeSheet(); toast(c.id + ' 已更新'); return refresh(); })
        .catch(function (e) { sv.disabled = false; sv.textContent = '儲存'; $('#aErr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
    });
  }
}

start();
</script>
